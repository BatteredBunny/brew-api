name: Update cask.json
on:
  push:
    paths:
      - .github/workflows/scheduled.yml
  schedule:
    # Every 60 minutes
    - cron: "0 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  save-api:
    name: Save api output
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Fetch homebrew/cask
        run: curl https://formulae.brew.sh/api/cask.json > raw.json

      - name: Update data for homebrew/cask
        run: (printf '[\n'; jq -c -f .github/filter.jq raw.json | sed 's/^/\t/;s/$/,/' | head -c -2; printf '\n]\n') > cask.json && rm raw.json

      - name: Push changes
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          add: '.'
          message: 'Update api output'
          default_author: github_actions
